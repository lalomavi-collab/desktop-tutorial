<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; background: #1B1B1B; overflow: hidden;
         font-family: 'Frank Ruhl Libre', 'David', 'Times New Roman', Georgia, serif; }
  .container { width: 100%; height: 100%; position: relative; display: flex; align-items: center; }
  .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(212,175,55,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(212,175,55,0.04) 1px, transparent 1px); background-size: 60px 60px; }
  .glow { position: absolute; inset-inline-start: -130px; bottom: -170px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(128,0,32,0.4), transparent 66%); }
  .content { position: relative; padding: 52px 76px; width: 100%; }
  .label { color: #D4AF37; font-size: 12px; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 22px; font-family: 'Heebo', Arial, 'Arial Hebrew', sans-serif; }
  h1 { color: #FFFDD0; font-size: 42px; font-weight: 400; line-height: 1.26; margin-bottom: 26px; }
  h1 em { color: #D4AF37; font-style: normal; }
  .sub { color: #FFFDD0; opacity: 0.62; font-size: 19px; line-height: 1.55; max-inline-size: 46ch; margin-bottom: 30px; font-family: 'Heebo', Arial, 'Arial Hebrew', sans-serif; }
  .triad { display: flex; gap: 24px; margin-bottom: 32px; }
  .t { flex: 1; border-top: 2px solid rgba(212,175,55,0.5); padding-top: 15px; }
  .t-n { color: #D4AF37; font-size: 15px; font-family: 'Heebo', Arial, 'Arial Hebrew', sans-serif; letter-spacing: 2px; margin-bottom: 8px; }
  .t-x { color: #FFFDD0; font-size: 17px; line-height: 1.45; opacity: 0.85; }
  .chain { display: flex; flex-direction: column; gap: 11px; margin-bottom: 30px; }
  .c { display: flex; gap: 14px; align-items: baseline; }
  .c-n { color: #D4AF37; font-size: 15px; font-family: 'Heebo', Arial, 'Arial Hebrew', sans-serif; flex: none; width: 26px; }
  .c-x { color: #FFFDD0; font-size: 19px; line-height: 1.45; opacity: 0.88; }
  .strip { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .cta { background: #D4AF37; color: #1B1B1B; font-family: 'Heebo', Arial, 'Arial Hebrew', sans-serif; font-size: 16px; font-weight: 700; padding: 13px 24px; border-radius: 4px; }
  .brand { color: #D4AF37; font-size: 17px; letter-spacing: 3px; font-family: 'Heebo', Arial, 'Arial Hebrew', sans-serif; }
  .url { color: #FFFDD0; font-size: 14px; opacity: 0.55; font-family: 'Heebo', Arial, 'Arial Hebrew', sans-serif; direction: ltr; margin-top: 6px; }
</style>
</head>
<body>
<div class="container">
  <div class="bg-grid"></div>
  <div class="glow"></div>
  <div class="content">
    <div class="label">מי אחראי כשה-AI טועה · 4 מתוך 5</div>
    <h1>"אנחנו חברה ישראלית,<br>ה-EU AI Act <em>לא רלוונטי לנו</em>."</h1>
    <div class="chain"><div class="c"><div class="c-n">01</div><div class="c-x">האם המערכת שלכם מסווגת כבסיכון גבוה?</div></div><div class="c"><div class="c-n">02</div><div class="c-x">מי הספק ומי המפעיל, משפטית ולא מסחרית?</div></div><div class="c"><div class="c-n">03</div><div class="c-x">האם קיימת מערכת ניהול סיכונים מתועדת?</div></div><div class="c"><div class="c-n">04</div><div class="c-x">מי חתום על הצהרת התאימות?</div></div></div>
    <div class="strip">
      <div class="cta">פגישת אבחון Tech-Legal</div>
      <div><div class="brand">LALUM</div><div class="url">lalumapp.com/book</div></div>
    </div>
  </div>
</div>
</body>
</html>
