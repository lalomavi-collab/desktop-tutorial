<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>אין חיבור לאינטרנט | LALUM</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      background: #fbf9f3;
      color: #1a1815;
      font-family: "Assistant", "Heebo", "Segoe UI", Tahoma, Arial, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 420px;
      text-align: center;
    }
    img { width: 68px; height: 68px; border-radius: 16px; }
    h1 { font-size: 22px; margin: 20px 0 10px; font-weight: 700; }
    p { font-size: 15.5px; line-height: 1.7; color: #55514a; margin: 0 0 22px; }
    button {
      font: inherit;
      font-weight: 700;
      color: #fff;
      background: #a8482a;
      border: 0;
      border-radius: 9999px;
      padding: 12px 26px;
      cursor: pointer;
    }
    button:hover { background: #8f3c22; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="LALUM" />
    <h1>אין כרגע חיבור לאינטרנט</h1>
    <p>נראה שהחיבור נותק. אפשר לנסות שוב ברגע שהחיבור חוזר. התוכן שכבר נטען זמין גם ללא רשת.</p>
    <button type="button" onclick="location.reload()">לניסיון חוזר</button>
  </div>
</body>
</html>
