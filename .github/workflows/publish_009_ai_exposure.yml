name: Publish Post 009 - AI Risk Exposure (LinkedIn, English)

# Manual only. There is no schedule: the post goes out when the assessment is
# live and the account owner triggers it, not on a date decided in advance.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish to LinkedIn
        env:
          HOOK: ${{ secrets.ZAPIER_LINKEDIN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request

          text = """Is your AI a strategic asset, or a multi-million shekel legal time bomb? ⚠️

          Almost every company, real estate developer and law firm is trying to cut corners on time. Running a complex 150 page evacuate-and-rebuild agreement through a public language model, or summarizing minutes and resident agreements in ChatGPT, sounds like time-saving magic.

          In practice? It is the "black box" trap.

          Public models that never went through algorithmic and professional review miss the smallest print of all:
          ❌ Convoluted legal drafting in Hebrew.
          ❌ Local authority carve-outs in urban renewal projects.
          ❌ Bank guarantees and critical conditions precedent.

          In real estate transactions and in startups, a gap that small is not merely an error. It is a cause of action, a loss of intellectual property, and years of bottlenecks.

          At the meeting point of code, law and economics, we cannot afford to gamble.

          That is exactly why we built LALUM: to engineer signed conformity and algorithmic defense for AI, through our proven frameworks DOM, RECIR and SRME.

          Today we take it one step further and launch a new tool on our site: 🎉 the Tech-Legal and AI Risk Exposure Assessment.

          A fast, focused, interactive two minute assessment that gives you an accurate, immediate picture of the exposure and risk level of your organization or project.

          Are you protected? Or are you operating under serious exposure?

          Do not guess. Check.

          👉 Run the assessment: https://lalumapp.com/risk/

          Then book a strategic, discreet diagnostic session with me.

          See you at the Tech-Legal frontier.

          ↳ LALUM | Tech-Legal Advisory, AI Governance and Real Estate
          https://lalumapp.com

          #LegalTech #AI #PropTech #TechLegal #RealEstate #RiskManagement #Lalum #ArtificialIntelligence"""

          # The heredoc is indented for readability inside the YAML step, so strip
          # that indentation back off before sending. Without this every line of
          # the published post would carry ten leading spaces.
          text = "\n".join(line[10:] if line.startswith(" " * 10) else line for line in text.split("\n"))

          hook = os.environ["HOOK"]
          if not hook:
              raise SystemExit("ZAPIER_LINKEDIN secret is empty")

          payload = {
              "text": text,
              # Map this field in the Zap to attach the card. Unmapped, Zapier
              # ignores it and LinkedIn falls back to the link preview of
              # lalumapp.com/risk.
              "image_url": "https://lalumapp.com/og/009-risk-en.png",
              "link": "https://lalumapp.com/risk/",
          }
          req = urllib.request.Request(
              hook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          with urllib.request.urlopen(req) as resp:
              print("LinkedIn hook responded:", resp.status, resp.read().decode())
          PYEOF
