name: Tax parameters watch

# Weekly. The engine tests (tax-check) fail the run when the code is wrong. The parameter staleness check does not:
# while the current year's statutory figures are a draft, or it is November or later and next year's are missing, it
# writes a warning on the run and keeps one open issue that says so. A red run that stays red for weeks until the
# bookkeeper confirms the figures teaches everyone to ignore red; one open issue does not. Indexation lands every
# 1 January, so the new year's figures must be read from the Tax Authority and the National Insurance Institute and
# entered as VERIFIED (two sources, enforced by the table) before then. This job only detects; it never changes a
# figure by itself, because a silently wrong rate is worse than a visible alarm.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lalum-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run tax-check
      - id: params
        run: |
          if npm run --silent tax-params-check > params.txt 2>&1; then echo "stale=false" >> "$GITHUB_OUTPUT"; else echo "stale=true" >> "$GITHUB_OUTPUT"; fi
          cat params.txt
      - if: steps.params.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning title=Tax parameters not verified::$(tr '\n' ' ' < params.txt | cut -c1-600)"
          title="פרמטרי מס: טיוטה, לא מאומתים"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$open" = "0" ]; then
            { cat params.txt; echo; echo "נפתח אוטומטית על ידי tax-params-watch. נסגר ידנית אחרי שהפרמטרים הוזנו כ-VERIFIED משני מקורות."; } > body.txt
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.txt
          fi
