name: Daily status Telegram report

# Sends an orderly daily update to the firm's Telegram at 20:00 Israel time:
# search entries, security status, and SEO/GEO promotion. Uses the existing
# TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets (@Lalumbot). The entries
# figures come from the real Google Search Console snapshot on the
# data/search-console branch. Visitor counts from Cloudflare are an optional
# extra line, shown only when CLOUDFLARE_API_TOKEN and CLOUDFLARE_ZONE_ID exist.

on:
  schedule:
    # 17:00 UTC is 20:00 in Israel during summer (IDT, UTC+3).
    # In winter (IST, UTC+2) this fires at 19:00; adjust if needed.
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Search Console data
        run: |
          git fetch origin 'refs/heads/data/search-console:refs/remotes/origin/data/search-console' || true
          git show origin/data/search-console:data/search-console/latest.json > /tmp/gsc.json 2>/dev/null || true
          git show origin/data/search-console~1:data/search-console/latest.json > /tmp/gsc_prev.json 2>/dev/null || true
          echo "current snapshot bytes: $(wc -c < /tmp/gsc.json 2>/dev/null || echo 0)"

      - name: Build daily report
        id: rep
        working-directory: lalum-app
        env:
          GSC_JSON: /tmp/gsc.json
          GSC_PREV_JSON: /tmp/gsc_prev.json
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          REPORT="$(node scripts/daily-report.mjs)"
          echo "$REPORT"
          {
            echo "text<<REPORT_EOF"
            echo "$REPORT"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send to Telegram
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXT: ${{ steps.rep.outputs.text }}
        run: |
          if [ -z "$BOT" ] || [ -z "$CHAT" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is missing, so the report cannot be sent. Add the secret in Settings, Secrets and variables, Actions."
            exit 1
          fi
          RESPONSE="$(curl -s -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${TEXT}" \
            --data-urlencode "disable_web_page_preview=true")"
          echo "$RESPONSE"
          if ! echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "::error::Telegram rejected the message, so the report was not delivered: $RESPONSE"
            exit 1
          fi
