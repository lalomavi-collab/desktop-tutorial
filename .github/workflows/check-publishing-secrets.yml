name: "Check publishing secrets (read only)"

# Answers one question: would a campaign post actually go out, or is a secret
# wrong? Every call it makes is a GET, so running it is free of consequences.
#
# Worth running after setting the secrets for the first time, after rotating a
# token, and whenever a publish fails: the error here names the problem, while a
# failed publish names it only after the attempt.
#
# A LinkedIn token expires about 60 days after it is issued, so this is also
# what to run before leaning on a campaign that has been idle for a while.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Check one platform instead of both"
        type: choice
        options: ["both", "facebook", "linkedin"]
        default: "both"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Verify the tokens without publishing"
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          python3 scripts/check_publishing_secrets.py \
            ${{ inputs.only != 'both' && format('--only {0}', inputs.only) || '' }}
