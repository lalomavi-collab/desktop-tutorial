name: Auto-merge daily audit

# The daily audit routine pushes fixes to a claude/daily-audit-* branch.
# This workflow rebuilds that branch and, only if the build passes, merges
# it into main. The build is the safety gate, so nothing reaches main (and
# the live site) without compiling and type-checking first.

on:
  push:
    branches:
      - "claude/daily-audit-**"

permissions:
  contents: write
  # Merging through a pull request needs to be able to open one.
  pull-requests: write

concurrency:
  group: daily-audit-automerge
  cancel-in-progress: false

jobs:
  build-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build (the safety gate)
        working-directory: lalum-app
        run: |
          npm ci || npm install
          npm run build

      - name: SEO/GEO check (the promotion gate)
        working-directory: lalum-app
        run: npm run seo-check

      - name: Merge to main, through a pull request
        # Not a direct push. A repository rule requires every change to main to
        # go through a pull request, so the `git push origin main` that used to
        # be here would have been rejected on the first run this workflow ever
        # had. It has never run, so nothing was lost, but the daily audit's
        # fixes would have sat on their branch behind a red workflow that
        # nobody was watching.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          # A pull request may already exist from an earlier push to the same
          # branch. That is not an error: the new commits are already on it.
          gh pr create --base main --head "$branch" \
            --title "Auto-merge daily audit: $branch" \
            --body "הבנייה ובדיקת ה-SEO עברו על הענף הזה, וזה השער שמכניס אותו ל-main." \
            || echo "A pull request for $branch already exists."
          gh pr merge "$branch" --squash --delete-branch
