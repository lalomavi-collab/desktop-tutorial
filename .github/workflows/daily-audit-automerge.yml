name: Auto-merge daily audit

# The daily updates job pushes the "חדשנו" feed to a
# claude/daily-audit-updates-* branch. This workflow rebuilds that branch and,
# only if the build and every guard below pass, merges it into main. The build
# is the safety gate, so nothing reaches main (and the live site) without
# compiling and type-checking first.
#
# This is the one automatic merge the owner approved (20.10.2026), and it is
# limited to lalum-app/src/data/updates.json. Every other branch, including
# the daily maintenance run, opens a draft pull request and waits for the
# owner's explicit word. The trigger used to be claude/daily-audit-**, wider
# than the guard below, so any branch under that prefix would have merged
# itself on a green build.

on:
  push:
    branches:
      - "claude/daily-audit-updates-*"

permissions:
  contents: write
  # Merging through a pull request needs to be able to open one.
  pull-requests: write

concurrency:
  group: daily-audit-automerge
  cancel-in-progress: false

jobs:
  build-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build (the safety gate)
        working-directory: lalum-app
        run: |
          npm ci || npm install
          npm run build

      - name: SEO/GEO check (the promotion gate)
        working-directory: lalum-app
        run: npm run seo-check

      - name: Guard, no automatic merge of ruling records
        # Rulings need two independent sources verified by a person (CLAUDE.md).
        # An automatic merge must never carry them, whatever the build says.
        run: |
          changed=$(git diff --name-only origin/main...HEAD)
          if echo "$changed" | grep -E '(^|/)rulings(\.data)?\.(json|ts)$'; then
            echo "Ruling records changed: this needs a human review, not an automatic merge."
            exit 1
          fi

      - name: Guard, the daily updates branch may change only the updates feed
        # The daily updates job writes developments to lalum-app/src/data/updates.json and nothing else.
        # Its two source rule is enforced by scripts/updates-check.mjs inside the build above.
        run: |
          case "${GITHUB_REF_NAME}" in
            claude/daily-audit-updates-*)
              others=$(git diff --name-only origin/main...HEAD | grep -v '^lalum-app/src/data/updates\.json$' || true)
              if [ -n "$others" ]; then
                echo "The daily updates branch changed files outside the feed:"
                echo "$others"
                exit 1
              fi
              ;;
          esac

      - name: Merge to main, through a pull request
        # Not a direct push. A repository rule requires every change to main to
        # go through a pull request, so the `git push origin main` that used to
        # be here would have been rejected on the first run this workflow ever
        # had. It has never run, so nothing was lost, but the daily audit's
        # fixes would have sat on their branch behind a red workflow that
        # nobody was watching.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME}"
          # A pull request may already exist from an earlier push to the same
          # branch. That is not an error: the new commits are already on it.
          gh pr create --base main --head "$branch" \
            --title "Auto-merge daily audit: $branch" \
            --body "הבנייה ובדיקת ה-SEO עברו על הענף הזה, וזה השער שמכניס אותו ל-main." \
            || echo "A pull request for $branch already exists."
          gh pr merge "$branch" --squash --delete-branch
